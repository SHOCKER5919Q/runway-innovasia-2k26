# Alembic configuration for RUNWAY.
#
# The database URL is NOT set here. It is read from RUNWAY_DATABASE_URL by
# migrations/env.py, so migrations always target the same database the
# application is configured for and a URL can never drift between the two.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
path_separator = os
# Timestamped revision ids so `ls versions/` reads in chronological order.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
